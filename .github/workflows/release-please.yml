name: Release Please

on:
    push:
        branches:
            - dev
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Prepare release on dev
        runs-on: ubuntu-latest
        steps:
            - name: Run release-please
              uses: googleapis/release-please-action@v4
              with:
                  token: ${{ secrets.GH_RP_PAT }}
                  target-branch: dev
                  config-file: release-please-config.json
                  manifest-file: .release-please-manifest.json
