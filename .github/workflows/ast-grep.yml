name: ast-grep

on:
  pull_request:
  push:
    branches:
      - dev
      - main

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint:ast

      - run: npm run test:ast
