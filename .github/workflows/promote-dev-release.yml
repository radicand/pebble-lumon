name: Promote Dev Release

on:
    pull_request:
        types:
            - closed
        branches:
            - dev
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: promote-dev-release
    cancel-in-progress: false

jobs:
    promote:
        name: Merge dev into main after release bump
        runs-on: ubuntu-latest
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.pull_request.merged == true &&
             startsWith(github.event.pull_request.head.ref, 'release-please--branches--dev'))
        steps:
            - name: Checkout main
              uses: actions/checkout@v4
              with:
                  ref: main
                  fetch-depth: 0
                  token: ${{ secrets.GH_RP_PAT }}

            - name: Configure git
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            - name: Merge dev into main
              run: |
                  git fetch origin dev main
                  git checkout main
                  git merge --no-ff --no-edit origin/dev
                  git push origin main
